spring.application.name=todo-management

# Control DB (tenant registry). User needs CREATE DATABASE privilege for provisioning.
app.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/todo_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.master.username=root
app.datasource.master.password=Mysql@11

# Shared credentials for tenant DBs (todo_<tenantKey>)
app.datasource.tenant.username=root
app.datasource.tenant.password=Mysql@11
app.datasource.tenant.jdbc-url-prefix=jdbc:mysql://localhost:3306/

# IMPORTANT: keep false. Boot auto-Flyway would run classpath:db/migration
# against the @Primary routing DS (default = todo_master) and wrongly create
# todos/user/role tables in the control DB. We migrate in code instead:
#   todo_master  -> classpath:db/master   (tenants + plans)
#   todo_<tenant> -> classpath:db/migration (app tables)
spring.flyway.enabled=false

# Avoid Boot SQL init tying JdbcTemplate/DataSource beans into a cycle
spring.sql.init.mode=never

# Flyway owns schema. Do not use update/validate against master default DS.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson 3 (Spring Boot 4): keep LocalDateTime as ISO-8601 text for the UI.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
